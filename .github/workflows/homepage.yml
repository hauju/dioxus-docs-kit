name: Dioxus Docs Kit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: dcr.oxidt.com
  IMAGE_NAME: oxidt/dioxus-docs-kit
  # Fail the build job when the raw (uncompressed) wasm grows past this. Retune
  # it deliberately when size work lands - see scripts/wasm-size.sh.
  WASM_SIZE_LIMIT_BYTES: "8000000"

# Cancel superseded runs on rapid pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check Format
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: rui314/setup-mold@v1
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Generate Tailwind CSS
        run: |
          bun install --frozen-lockfile
          bunx @tailwindcss/cli -i tailwind.css -o assets/tailwind.css
      # The crate ships a precompiled stylesheet (DOCS_KIT_CSS). Fail if the
      # committed output is stale relative to its input/sources (`just css`).
      # Uses the lockfile-pinned binary, not bunx, so local and CI output match.
      - name: Check precompiled kit CSS is fresh
        run: |
          ./node_modules/.bin/tailwindcss -i crates/dioxus-docs-kit/tailwind.css -o crates/dioxus-docs-kit/assets/docs-kit.css --minify
          git diff --exit-code crates/dioxus-docs-kit/assets/docs-kit.css
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Clippy (highlight feature off)
        run: cargo clippy -p dioxus-mdx -p dioxus-docs-kit --no-default-features --features web --all-targets -- -D warnings
      # Proves the highlight-off wasm build needs no C toolchain (no
      # arborium/dioxus-code crates are pulled in at all).
      - name: Check wasm build (highlight feature off)
        run: cargo check -p dioxus-docs-kit --target wasm32-unknown-unknown --no-default-features --features web

  unused-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies for vulnerabilities
        run: cargo audit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: rui314/setup-mold@v1
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Generate Tailwind CSS
        run: |
          bun install --frozen-lockfile
          bunx @tailwindcss/cli -i tailwind.css -o assets/tailwind.css
      - name: Run unit tests
        run: cargo test --workspace --all-features

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep in sync with workspace.package.rust-version in Cargo.toml.
      # The published crates use let-chains, which need 1.88.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: rui314/setup-mold@v1
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check published crates on the declared MSRV
        run: cargo check -p dioxus-mdx -p dioxus-docs-kit -p dioxus-docs-kit-build

  build:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, unused-dependencies, security-audit, unit-tests, msrv]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: rui314/setup-mold@v1
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Generate Tailwind CSS
        run: |
          bun install --frozen-lockfile
          bunx @tailwindcss/cli -i tailwind.css -o assets/tailwind.css

      # --debug-symbols false strips DWARF from the wasm. Without it wasm-opt is
      # handed --debuginfo, aborts on the DWARF it cannot rewrite, and dx falls
      # back to the *unoptimized* wasm-bindgen output.
      - name: Build
        run: dx bundle --web --release --debug-symbols false
        env:
          # DOCS_SITE_URL is a repo Actions variable holding this site's public
          # origin (https://dioxus-docs-kit.oxidt.com). Read at COMPILE time by
          # option_env! — it must be on this build step, not Coolify's runtime env.
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}

      # dioxus-server serves each static file through
      # `ServeFile::new(path).precompressed_br()`, so a `foo.wasm.br` sidecar is
      # returned with `content-encoding: br` to clients that accept it. It never
      # looks for gzip sidecars, so only brotli is worth writing.
      - name: Pre-compress web assets with brotli
        run: |
          sudo apt-get update && sudo apt-get install -y brotli
          find target/dx/dioxus-docs-kit-example/release/web/public \
            -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.css' \) \
            -exec brotli -q 11 -f -k {} +

      - name: Check bundle size
        run: ./scripts/wasm-size.sh

      - name: Set up Node for browser checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser smoke runner
        run: |
          npm install --global agent-browser@0.23.4
          agent-browser install --with-deps

      - name: Check search in the bundled site
        run: |
          cd target/dx/dioxus-docs-kit-example/release/web
          IP=127.0.0.1 PORT=18479 ./dioxus-docs-kit-example > "$RUNNER_TEMP/docs-kit-server.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18479/docs/getting-started/introduction > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/docs-kit-server.log"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/scripts/browser-smoke.py" http://127.0.0.1:18479

      # Registry secrets are unavailable on fork PRs, so only set up Docker and
      # push the image on push events.
      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DCR_USERNAME }}
          password: ${{ secrets.DCR_PASSWORD }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify Deployment
        run: |
          curl --request GET '${{ vars.COOLIFY_WEBHOOK }}&force=true' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
