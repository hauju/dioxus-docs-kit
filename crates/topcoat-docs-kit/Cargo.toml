[package]
name = "topcoat-docs-kit"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Topcoat's own MSRV.
rust-version = "1.98"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Documentation site shell for Topcoat applications, on the dioxus-docs-kit content pipeline"
documentation = "https://docs.rs/topcoat-docs-kit"
keywords = ["topcoat", "documentation", "mdx", "docs-site"]
categories = ["web-programming"]
readme = "README.md"

[dependencies]
docs-kit-core = { workspace = true, features = ["openapi"] }
# Types, the Lucide icon data and the highlighter only: no Dioxus components.
dioxus-mdx = { workspace = true }
hl-lite = { workspace = true }
topcoat = { version = "0.9", default-features = false, features = ["router"] }

[features]
default = ["mermaid"]
# Render ```mermaid fences as diagrams. Once a diagram nears the viewport, the
# browser loads mermaid's ESM build from jsDelivr; turn this off to keep pages
# free of third-party scripts (the fences then render as ordinary code blocks).
mermaid = []

[dev-dependencies]
dioxus-docs-kit-build = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
