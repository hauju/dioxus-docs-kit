[package]
name = "dioxus-docs-kit-build"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Build-time helper for dioxus-docs-kit: generates content maps from _nav.json"
documentation = "https://docs.rs/dioxus-docs-kit-build"
keywords = ["dioxus", "documentation", "build-script"]
categories = ["development-tools::build-utils"]
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# Pinned to the rustdoc JSON format version this crate's distiller understands.
# Bumping it changes which nightly's `--output-format json` output parses.
rustdoc-types = "0.60.0"

[[bin]]
name = "distill-rustdoc"
path = "src/bin/distill_rustdoc.rs"
