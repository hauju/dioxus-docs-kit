[package]
name = "dioxus-mdx"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MDX parsing and rendering components for Dioxus"
documentation = "https://docs.rs/dioxus-mdx"
keywords = ["dioxus", "mdx", "markdown", "documentation", "parser"]
categories = ["parsing", "web-programming", "text-processing"]
readme = "README.md"

[dependencies]
dioxus = { workspace = true, features = ["lib"] }
dioxus-free-icons = { workspace = true }
dioxus-code = { workspace = true, optional = true, features = [
    "lang-bash",
    "lang-c-sharp",
    "lang-cpp",
    "lang-css",
    "lang-dockerfile",
    "lang-html",
    "lang-javascript",
    "lang-json",
    "lang-markdown",
    "lang-python",
    "lang-tsx",
    "lang-toml",
    "lang-typescript",
    "lang-yaml",
] }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
regex = "1.11"
markdown = "1.0"
openapiv3 = "2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }

[features]
default = ["web", "mermaid", "highlight"]
web = ["dioxus/web"]
mermaid = []
highlight = ["dep:dioxus-code"]

[package.metadata.docs.rs]
# Document the highlight/mermaid code paths, not just the default build.
all-features = true
