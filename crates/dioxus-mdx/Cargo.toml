[package]
name = "dioxus-mdx"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MDX parsing and rendering components for Dioxus"
documentation = "https://docs.rs/dioxus-mdx"
keywords = ["dioxus", "mdx", "markdown", "documentation", "parser"]
categories = ["parsing", "web-programming", "text-processing"]
readme = "README.md"

[dependencies]
dioxus = { workspace = true, features = ["lib"], optional = true }
# Only the renderer highlights code, so it rides with `components`.
hl-lite = { workspace = true, optional = true }

# The parser and document types; this crate re-exports them.
oxidt-mdx = { workspace = true }
# The wasm-only clipboard and scroll-spy scripts JSON-encode their arguments.
serde_json = { workspace = true }

# `dioxus-web`'s history implementation calls `window.location()` but only asks
# for `web-sys/Location` from its own `devtools` feature, so a build that enables
# `dioxus/web` without `dioxus/devtools` fails to compile it. Depending on
# web-sys here unifies the feature back in. (It used to arrive by accident:
# `dioxus-free-icons` re-enabled dioxus's default features, `devtools` among
# them, in every consumer.)
web-sys = { version = "0.3", optional = true, features = ["Location"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true, optional = true }

[features]
default = ["components", "parse", "web", "mermaid", "openapi-parse"]

# The Dioxus renderer components. Turning this off leaves only the
# `oxidt-mdx` re-exports; depend on `oxidt-mdx` directly for that.
components = ["dep:dioxus", "dep:gloo-timers", "dep:hl-lite"]

# `oxidt-mdx`'s MDX/Markdown parser (markdown-rs + a regex engine), plus
# `MdxContent`, which parses at runtime. A docs-kit app leaves it off: its pages
# are parsed at build time and shipped as a JSON bundle.
parse = ["oxidt-mdx/parse"]

web = ["components", "dioxus/web", "dep:web-sys"]
mermaid = ["components"]

# `openapi` is the value types plus the viewer components, which cost no extra
# dependencies. `openapi-parse` adds `oxidt-mdx`'s spec *parser*
# (`parse_openapi`, inline `<OpenAPI>` blocks) and with it `openapiv3` and
# `serde_yaml` — build-time only in a docs-kit app.
openapi = ["oxidt-mdx/openapi"]
openapi-parse = ["openapi", "parse", "oxidt-mdx/openapi-parse"]

[package.metadata.docs.rs]
features = ["web", "mermaid", "parse", "openapi-parse"]

[package.metadata.cargo-machete]
# Depended on purely to turn on `web-sys/Location` for `dioxus-web`; nothing in
# this crate calls it, so machete cannot see the use.
ignored = ["web-sys"]
