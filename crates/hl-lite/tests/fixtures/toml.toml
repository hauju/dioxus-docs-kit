# Workspace manifest for the docs kit.
[workspace]
members = [
    "crates/dioxus-docs-kit",
    "crates/dioxus-mdx",
    "crates/hl-lite",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/hauju/dioxus-docs-kit"

[workspace.dependencies]
dioxus = { version = "0.7.10", default-features = false }
hl-lite = { version = "0.8.0", path = "crates/hl-lite" }
serde = { version = "1.0", features = ["derive"] }

[package]
name = "dioxus-docs-kit-example"
version.workspace = true
publish = false
description = """
An example app. Multi-line basic strings keep
their newlines, and \\ escapes still work.
"""
homepage = 'https://dioxus-docs-kit.oxidt.com'
build-started = 2026-09-18T07:32:00Z
released = 1979-05-27
daily-at = 07:32:00
ratio = 1.618_034
port = 8080
retries = -3
enabled = true
threshold = inf

[features]
default = ["web", "highlight"]
web = ["dioxus/web"]
highlight = []

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "snapshot"
path = "tools/snapshot.rs"

[package.metadata.docs.rs]
features = ["web", "highlight"]
rustdoc-args = ["--cfg", "docsrs"]
"literal.key" = 'no \escapes here'
