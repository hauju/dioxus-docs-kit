[package]
name = "dioxus-docs-kit"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reusable documentation site shell for Dioxus applications"
documentation = "https://docs.rs/dioxus-docs-kit"
keywords = ["dioxus", "documentation", "mdx", "docs-site", "openapi"]
categories = ["web-programming", "gui"]
readme = "README.md"

[dependencies]
dioxus = { workspace = true, features = ["lib", "router"] }
# Renderer components only: the parser (`parse`) and the OpenAPI spec reader
# (`openapi-parse`) run in `dioxus-docs-kit-build`, so markdown-rs, a regex
# engine, `openapiv3` and `serde_yaml` never reach the client.
dioxus-mdx = { workspace = true, features = ["components"] }
dioxus-fullstack-core = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
webmcp-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
# Tests build real content bundles with the same code `build.rs` runs, so the
# runtime types are exercised against genuine generator output. Dev-only: it
# never reaches a consumer's dependency graph.
dioxus-docs-kit-build = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }

[features]
default = ["web", "mermaid", "openapi"]
web = ["dioxus/web", "dioxus-mdx/web"]
server = ["dioxus/server", "dep:dioxus-fullstack-core"]
mermaid = ["dioxus-mdx/mermaid"]
# The API-reference machinery: endpoint pages, the API sidebar and the search
# entries for operations. Costs no extra dependencies since 0.9.0 — the spec is
# parsed by `dioxus-docs-kit-build` — but leaving it off drops that code and
# makes the registry ignore any specs in the bundle.
openapi = ["dioxus-mdx/openapi"]
# Register the site's docs as WebMCP tools for an in-browser agent
# (`DocsWebMcp`). Off by default: it pulls `webmcp-rs` + `schemars`, and a
# docs site that never meets an agent should not pay for them.
webmcp = ["dep:webmcp-rs", "dep:schemars"]

[package.metadata.docs.rs]
# Without `server` the `SeoRouter` module is absent from docs.rs - it 404'd on
# 0.5.0.
features = ["server"]

[package.metadata.cargo-machete]
# The package is `webmcp-rs` but its library is `webmcp`, so `use webmcp::...`
# in src/webmcp.rs does not look like a use of this dependency to machete.
ignored = ["webmcp-rs"]
