[workspace]
members = [
    "crates/dioxus-docs-kit",
    "crates/dioxus-docs-kit-build",
    "crates/dioxus-mdx",
    "crates/hl-lite",
]

[workspace.package]
version = "0.8.0"
authors = ["Hauke Jung <hauke.jung@outlook.de>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/hauju/dioxus-docs-kit"
homepage = "https://github.com/hauju/dioxus-docs-kit"

[workspace.dependencies]
dioxus = { version = "0.7.10", default-features = false }
dioxus-fullstack-core = "0.7.10"
dioxus-mdx = { version = "0.8.0", path = "crates/dioxus-mdx", default-features = false }
dioxus-docs-kit = { version = "0.8.0", path = "crates/dioxus-docs-kit", default-features = false }
dioxus-docs-kit-build = { version = "0.8.0", path = "crates/dioxus-docs-kit-build" }
hl-lite = { version = "0.8.0", path = "crates/hl-lite" }
serde = { version = "1.0", features = ["derive"] }
schemars = "1"
webmcp-rs = { version = "0.1", default-features = false, features = ["schema", "dioxus"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }

[package]
name = "dioxus-docs-kit-example"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The workspace dependency sets `default-features = false` so the library
# crates don't force `launch`/`logger`/`devtools` on their consumers; the
# binary needs them itself (hot reload, `tracing` output in the console).
dioxus = { workspace = true, features = [
    "lib",
    "router",
    "fullstack",
    "launch",
    "devtools",
    "logger",
] }
dioxus-docs-kit = { workspace = true }

[build-dependencies]
dioxus-docs-kit-build = { workspace = true }

[features]
default = ["web", "mermaid", "openapi", "webmcp"]
web = ["dioxus/web", "dioxus-docs-kit/web"]
server = ["dioxus/server", "dioxus-docs-kit/server"]
mermaid = ["dioxus-docs-kit/mermaid"]
openapi = ["dioxus-docs-kit/openapi"]
webmcp = ["dioxus-docs-kit/webmcp"]

# `dx` does not build with the plain `release` profile: it derives one per
# bundle format, so `dx bundle --web --release` compiles the wasm client with
# `wasm-release` and the fullstack server with `server-release` (see
# `BundleFormat::profile_name` in dioxus-cli). Defining them here replaces the
# ad-hoc profiles dx would otherwise synthesise (`inherits = "release"` plus
# `opt-level = "s"` for the web client).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
# wasm-only profile, so aborting is safe here - it never applies to the server.
panic = "abort"

[profile.server-release]
inherits = "release"
# The server binary is not shipped over the wire, so keep it fast (`release`
# opt-level) and keep unwinding; strip is what shrinks the container image.
lto = "fat"
codegen-units = 1
strip = true
