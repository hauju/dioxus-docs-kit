[workspace]
members = [
    "crates/dioxus-docs-kit",
    "crates/dioxus-docs-kit-build",
    "crates/dioxus-mdx",
]

[workspace.package]
version = "0.7.1"
authors = ["Hauke Jung <hauke.jung@outlook.de>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/hauju/dioxus-docs-kit"
homepage = "https://github.com/hauju/dioxus-docs-kit"

[workspace.dependencies]
dioxus = { version = "0.7.10", default-features = false }
dioxus-fullstack-core = "0.7.10"
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
dioxus-code = { version = "0.1.2", default-features = false, features = ["runtime"] }
dioxus-mdx = { version = "0.7.1", path = "crates/dioxus-mdx", default-features = false }
dioxus-docs-kit = { version = "0.7.1", path = "crates/dioxus-docs-kit", default-features = false }
dioxus-docs-kit-build = { version = "0.7.1", path = "crates/dioxus-docs-kit-build" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }

[package]
name = "dioxus-docs-kit-example"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The workspace dependency sets `default-features = false` so the library
# crates don't force `launch`/`logger`/`devtools` on their consumers; the
# binary needs them itself (hot reload, `tracing` output in the console).
dioxus = { workspace = true, features = [
    "lib",
    "router",
    "fullstack",
    "launch",
    "devtools",
    "logger",
] }
dioxus-free-icons = { workspace = true }
dioxus-docs-kit = { workspace = true }

[build-dependencies]
dioxus-docs-kit-build = { workspace = true }

[features]
# The example enables only the grammars `docs/` actually fences (plus bash and
# json, which the generated API reference pages use) rather than the kit default.
default = [
    "web",
    "mermaid",
    "highlight",
    "openapi",
    "lang-bash",
    "lang-css",
    "lang-json",
    "lang-python",
    "lang-typescript",
]
web = ["dioxus/web", "dioxus-docs-kit/web"]
server = ["dioxus/server", "dioxus-docs-kit/server"]
mermaid = ["dioxus-docs-kit/mermaid"]
highlight = ["dioxus-docs-kit/highlight"]
openapi = ["dioxus-docs-kit/openapi"]

# Syntax-highlighting grammars, one tree-sitter parser each. `highlight` on its
# own compiles no grammar beyond Rust, which ships with `dioxus-code`'s
# `runtime` (hence `lang-rust` needs nothing extra). Enable only the languages
# your fences actually use: dropping just the C# and C++ grammars took this
# repo's release wasm from 19.0 MB to 9.9 MB. A fence whose grammar is not
# compiled in renders as plain text.
#
# For a language not listed here, depend on `dioxus-code` directly with its
# `lang-*` flag; cargo unifies the feature into this crate's copy of the
# dependency and `Language::from_slug` picks the grammar up:
#   dioxus-code = { version = "0.1", default-features = false, features = [
#       "runtime", "lang-go",
#   ] }
lang-rust = ["highlight", "dioxus-docs-kit/lang-rust"]
lang-bash = ["highlight", "dioxus-docs-kit/lang-bash"]
lang-c-sharp = ["highlight", "dioxus-docs-kit/lang-c-sharp"]
lang-cpp = ["highlight", "dioxus-docs-kit/lang-cpp"]
lang-css = ["highlight", "dioxus-docs-kit/lang-css"]
lang-dockerfile = ["highlight", "dioxus-docs-kit/lang-dockerfile"]
lang-html = ["highlight", "dioxus-docs-kit/lang-html"]
lang-javascript = ["highlight", "dioxus-docs-kit/lang-javascript"]
lang-json = ["highlight", "dioxus-docs-kit/lang-json"]
lang-markdown = ["highlight", "dioxus-docs-kit/lang-markdown"]
lang-python = ["highlight", "dioxus-docs-kit/lang-python"]
lang-toml = ["highlight", "dioxus-docs-kit/lang-toml"]
lang-tsx = ["highlight", "dioxus-docs-kit/lang-tsx"]
lang-typescript = ["highlight", "dioxus-docs-kit/lang-typescript"]
lang-yaml = ["highlight", "dioxus-docs-kit/lang-yaml"]

# `dx` does not build with the plain `release` profile: it derives one per
# bundle format, so `dx bundle --web --release` compiles the wasm client with
# `wasm-release` and the fullstack server with `server-release` (see
# `BundleFormat::profile_name` in dioxus-cli). Defining them here replaces the
# ad-hoc profiles dx would otherwise synthesise (`inherits = "release"` plus
# `opt-level = "s"` for the web client).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
# wasm-only profile, so aborting is safe here - it never applies to the server.
panic = "abort"

[profile.server-release]
inherits = "release"
# The server binary is not shipped over the wire, so keep it fast (`release`
# opt-level) and keep unwinding; strip is what shrinks the container image.
lto = "fat"
codegen-units = 1
strip = true
